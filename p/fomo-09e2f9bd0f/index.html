<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="/app-icon.jpg">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Send to Rental House</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbit&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: the app's gridded kit list on the left, the rental side on the right; one flow, four steps. */
:root {
  --paper: #d9d2ca; --paper-2: #e8e2d8; --sheet: #ffffff; --ink: #191919; --mute: #6f675f;
  --rule: #191919; --orange: #ff570c; --orange-soft: #ffe9de; --ok: #1f7a4f; --ok-soft: #e1efe6;
  --band: #191919; --band-fg: #ffffff;
  --display: "Orbit", "JetBrains Mono", ui-monospace, monospace;
  --body: "Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1d1b19; --paper-2: #26231f; --sheet: #2d2a26; --ink: #efe9e1; --mute: #a69d93;
  --rule: #4a4540; --orange: #ff6a26; --orange-soft: #3d2618; --ok: #6cc596; --ok-soft: #1f3328;
  --band: #0f0e0d; --band-fg: #efe9e1; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1d1b19; --paper-2: #26231f; --sheet: #2d2a26; --ink: #efe9e1; --mute: #a69d93;
  --rule: #4a4540; --orange: #ff6a26; --orange-soft: #3d2618; --ok: #6cc596; --ok-soft: #1f3328;
  --band: #0f0e0d; --band-fg: #efe9e1; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.mono { font-family: var(--display); letter-spacing: .04em; }
.label { font-family: var(--display); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.top h1 { margin: 4px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 4vw, 30px); text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--mute); max-width: 60ch; }
.house-field { display: grid; gap: 4px; }
.house-field input { font: inherit; font-family: var(--display); font-size: 13px; padding: 8px 10px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); width: 240px; max-width: 100%; }

.steps { display: flex; flex-wrap: wrap; border: 1px solid var(--rule); background: var(--sheet); }
.steps button { flex: 1 1 140px; font: inherit; font-family: var(--display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 10px 12px; border: 0; border-right: 1px solid var(--rule); background: transparent; color: var(--mute); cursor: pointer; text-align: left; }
.steps button:last-child { border-right: 0; }
.steps button[aria-current="step"] { background: var(--orange); color: #fff; }
.steps button:focus-visible, .btn:focus-visible, .opt:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 16px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }

.panel { border: 1px solid var(--rule); background: var(--sheet); min-width: 0; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 14px; min-height: 40px; background: var(--band); color: var(--band-fg); font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.bar .count { color: var(--orange); }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 72px; border-bottom: 1px solid var(--rule); }
.facts > div { padding: 8px 12px; border-right: 1px solid var(--rule); min-width: 0; }
.facts > div:last-child { border-right: 0; }
.facts .v { font-family: var(--display); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facts .v.big { color: var(--orange); font-size: 18px; }
@media (max-width: 520px) { .facts { grid-template-columns: 1fr 1fr; } .facts > div { border-bottom: 1px solid var(--rule); } }

.sec { padding: 6px 14px; background: var(--paper-2); border-bottom: 1px solid var(--rule); font-family: var(--display); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; }
.sec span:last-child { color: var(--orange); }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; border-bottom: 1px solid var(--rule); min-height: 50px; }
.row:last-child { border-bottom: 0; }
.ph { border-right: 1px solid var(--rule); background: #fff; display: grid; place-items: center; }
.ph svg { width: 30px; height: 30px; }
.ph img { width: 100%; height: 100%; object-fit: contain; padding: 4px; display: block; }
.nm { padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.nm b { font-family: var(--display); font-weight: 400; font-size: 13px; }
.nm small { color: var(--mute); font-size: 12px; }
.qt { padding: 0 12px; display: flex; align-items: center; gap: 8px; border-left: 1px solid var(--rule); font-family: var(--display); font-size: 12px; white-space: nowrap; }
.tag { font-family: var(--display); font-size: 10px; letter-spacing: .06em; padding: 3px 6px; border: 1px solid currentColor; }
.tag.ok { color: var(--ok); background: var(--ok-soft); }
.tag.sub { color: var(--orange); background: var(--orange-soft); }

.side { display: grid; gap: 12px; padding: 14px; }
.side h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 18px; }
.side p { margin: 0; color: var(--mute); }
.btn { font: inherit; font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 12px 14px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; text-align: center; }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.opt { font: inherit; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
.opt[aria-pressed="true"] { outline: 2px solid var(--orange); outline-offset: -2px; background: var(--orange-soft); }
.opt[disabled] { opacity: .5; cursor: not-allowed; }
.opt b { font-family: var(--display); font-weight: 400; }
.opt small { color: var(--mute); grid-column: 1 / -1; }
.opt .pill { font-family: var(--display); font-size: 10px; letter-spacing: .08em; color: var(--orange); align-self: center; }
.field { display: grid; gap: 4px; }
.field input, .field textarea, .field select { font: inherit; padding: 9px 10px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); width: 100%; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; border: 1px solid var(--rule); }
.seg button { flex: 1; font: inherit; font-family: var(--display); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 9px; border: 0; border-right: 1px solid var(--rule); background: var(--sheet); color: var(--mute); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--orange); color: #fff; }
.match { border: 1px solid var(--rule); }
.match div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--rule); font-size: 13px; }
.match div:last-child { border-bottom: 0; }
.sum { font-family: var(--display); font-size: 12px; display: flex; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 10px; }

.order { border: 1px solid var(--rule); background: var(--sheet); }
.order .head { padding: 12px 14px; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.order .head b { font-family: var(--display); font-weight: 400; font-size: 16px; }
.order .meta { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--rule); }
.order .meta div { padding: 8px 14px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); min-width: 0; }
.order .meta div:nth-child(2n) { border-right: 0; }
.order .meta div:nth-last-child(-n+2) { border-bottom: 0; }
.order .meta .v { font-family: var(--display); font-size: 12px; }
.order ol { margin: 0; padding: 0; list-style: none; }
.order li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; padding: 7px 14px; border-bottom: 1px solid var(--rule); font-size: 13px; align-items: center; }
.order li .q { font-family: var(--display); color: var(--orange); display: flex; align-items: center; gap: 6px; }
.order li .c { font-family: var(--display); font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
.order .acts { display: flex; gap: 8px; padding: 12px 14px; flex-wrap: wrap; }
.order .acts .btn { flex: 1 1 140px; }
.sent { display: grid; gap: 8px; padding: 14px; border: 1px solid var(--ok); background: var(--ok-soft); color: var(--ink); }
.sent b { font-family: var(--display); font-weight: 400; color: var(--ok); font-size: 15px; }
.note { color: var(--mute); font-size: 12px; }
.flash { font-family: var(--display); font-size: 11px; color: var(--ok); min-height: 16px; }
@media (prefers-reduced-motion: no-preference) { .stage > * { animation: in .25s ease-out; } @keyframes in { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="label">The Gear App · concept preview</div>
      <h1>Send a kit list to a rental house</h1>
      <p>Plan the shoot in The Gear App, then send the list in one tap. The rental house gets a clean, itemised request, matched to their own stock.</p>
    </div>
    <label class="house-field" for="house">
      <span class="label">Rental house name (for the demo)</span>
      <input id="house" value="FOMO Rentals" maxlength="40">
    </label>
  </header>

  <nav class="steps" aria-label="Steps">
    <button id="s1" type="button">1 · Kit list</button>
    <button id="s2" type="button">2 · Choose rental house</button>
    <button id="s3" type="button">3 · Dates &amp; details</button>
    <button id="s4" type="button">4 · Sent</button>
  </nav>

  <section class="stage" id="stage"></section>

  <p class="note">Concept preview with example data. Nothing here is sent anywhere.</p>
</div>

  const KIT = [
    { cat: 'Camera', icon: 'camera', items: [
      { name: 'Sony FX6 Full-Frame Cinema Camera', qty: 2, img: 'fx6', match: 'ok' },
      { name: 'SmallRig Cage Kit for Sony FX6', qty: 2, img: 'cage', match: 'ok' },
    ]},
    { cat: 'Lens', icon: 'lens', items: [
      { name: 'DZOFILM Pavo 32mm T2.1 (PL + EF)', qty: 1, img: 'pavo32', match: 'ok' },
      { name: 'DZOFILM Pavo 75mm T2.1 (PL + EF)', qty: 1, img: 'pavo75', match: 'sub', sub: 'Cooke Panchro/i Classic 75mm' },
      { name: 'Sigma 24–70mm F2.8 DG DN Art', qty: 1, img: 'sigma2470', match: 'ok' },
    ]},
    { cat: 'Lighting', icon: 'light', items: [
      { name: 'Aputure Storm 80C', qty: 2, img: 'storm80c', match: 'ok' },
      { name: 'Nanlite Forza 60B II Bi-Colour', qty: 1, img: 'forza60b', match: 'ok' },
    ]},
    { cat: 'Audio', icon: 'audio', items: [
      { name: 'Rode Wireless PRO (2 TX + 1 RX)', qty: 1, img: 'rodewp', match: 'ok' },
      { name: 'Sennheiser MKE 600 Shotgun', qty: 1, img: 'mke600', match: 'ok' },
    ]},
    { cat: 'Support', icon: 'support', items: [
      { name: 'Manfrotto 028B Triman Tripod', qty: 2, match: 'ok', img: 'tripod' },
      { name: 'Angelbird 256GB CFexpress Type A', qty: 4, img: 'angelbird', match: 'ok' },
    ]},
  ];
  const all = KIT.flatMap(g => g.items.map(it => ({ ...it, cat: g.cat, icon: g.icon })));
  const units = all.reduce((n, it) => n + it.qty, 0);
  const subs = all.filter(it => it.match === 'sub');

  const state = { step: 1, house: null, mode: 'collect', out: '2026-11-17', back: '2026-11-18', notes: 'Two-camera interview, Bristol warehouse. Happy with a like-for-like swap on the 75mm.' };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const houseName = () => esc(($('house').value || 'FOMO Rentals').trim() || 'FOMO Rentals');
  const fmt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const days = () => Math.max(1, Math.round((new Date(state.back) - new Date(state.out)) / 864e5) + 1);

  function kitPanel(withMatch) {
    let html = `<div class="panel"><div class="bar"><span>Atlas Doc · Day 2</span><span class="count">${units} items</span></div>
      <div class="facts"><div><div class="label">Client</div><div class="v">Atlas Films</div></div>
      <div><div class="label">Shoot</div><div class="v">Mon 17 Nov</div></div>
      <div><div class="label">Location</div><div class="v">Bristol</div></div>
      <div><div class="label">Unique</div><div class="v big">${all.length}</div></div></div>`;
    for (const g of KIT) {
      html += `<div class="sec"><span>${g.cat}</span><span>${g.items.reduce((n, i) => n + i.qty, 0)}</span></div>`;
      for (const it of g.items) {
        let tag = '';
        if (withMatch) tag = it.match === 'ok' ? '<span class="tag ok">In stock</span>' : '<span class="tag sub">Swap offered</span>';
        html += `<div class="row"><div class="ph">${it.img ? `<img src="${IMG[it.img]}" alt="">` : ICON[g.icon]}</div>
          <div class="nm"><b>${esc(it.name)}</b>${withMatch && it.sub ? `<small>${houseName()} suggests: ${esc(it.sub)}</small>` : ''}</div>
          <div class="qt">${tag}<span>×${it.qty}</span></div></div>`;
      }
    }
    return html + '</div>';
  }

  function sideStep1() {
    return `<div class="panel side">
      <span class="label">Kit list ready</span>
      <h2>${units} items across ${KIT.length} departments</h2>
      <p>Built with Suggest and checked for compatibility. Next, send it to a rental house for a quote, without retyping anything into an email.</p>
      <button class="btn primary" id="go2" type="button">Send to rental house →</button>
      <button class="btn" type="button" disabled>Export PDF</button>
    </div>`;
  }
  function sideStep2() {
    const h = houseName();
    return `<div class="panel side">
      <span class="label">Step 2</span>
      <h2>Choose a rental house</h2>
      <button class="opt" id="pick" type="button" aria-pressed="${state.house ? 'true' : 'false'}">
        <b>${h}</b><span class="pill">${all.length - subs.length}/${all.length} matched</span>
        <small>London · catalogue linked · usually quotes within 2 hours</small>
      </button>
      <button class="opt" type="button" disabled><b>More London houses</b><span class="pill">Soon</span><small>Coming as more rental houses join</small></button>
      <button class="btn primary" id="go3" type="button" ${state.house ? '' : 'disabled'}>Continue →</button>
    </div>`;
  }
  function sideStep3() {
    return `<div class="panel side">
      <span class="label">Step 3 · ${houseName()}</span>
      <h2>Dates &amp; details</h2>
      <div class="two">
        <label class="field" for="out"><span class="label">Collect</span><input id="out" type="date" value="${state.out}"></label>
        <label class="field" for="back"><span class="label">Return</span><input id="back" type="date" value="${state.back}"></label>
      </div>
      <div class="seg" role="group" aria-label="Handover">
        <button type="button" id="m-collect" aria-pressed="${state.mode === 'collect'}">Collect</button>
        <button type="button" id="m-deliver" aria-pressed="${state.mode === 'deliver'}">Deliver</button>
      </div>
      <label class="field" for="notes"><span class="label">Note to the rental house</span><textarea id="notes" rows="3">${esc(state.notes)}</textarea></label>
      <div class="match">
        <div><span>Matched to their stock</span><b class="mono">${all.length - subs.length}</b></div>
        <div><span>Swaps offered</span><b class="mono" style="color:var(--orange)">${subs.length}</b></div>
        <div><span>Hire length</span><b class="mono">${days()} day${days() > 1 ? 's' : ''}</b></div>
      </div>
      <button class="btn primary" id="go4" type="button">Send request</button>
      <span class="note">No payment now. ${houseName()} replies with a quote you can accept.</span>
    </div>`;
  }
  function stage4() {
    const h = houseName();
    const lines = all.map(it => `<li><span class="q">${it.img ? `<img src="${IMG[it.img]}" alt="" style="width:30px;height:30px;object-fit:contain;background:#fff;display:block">` : ''}×${it.qty}</span><span>${esc(it.sub && it.match === 'sub' ? it.name + ' → ' + it.sub + ' (swap)' : it.name)}</span><span class="c">${it.cat}</span></li>`).join('');
    return `<div style="display:grid;gap:12px;min-width:0">
      <div class="sent"><b>Request sent to ${h}</b><span>They've got your list, dates and contact details. You'll get a quote here and by email, usually within 2 hours.</span></div>

    </div>

      <span class="label">What ${h} receives</span>
      <div class="order">

        <div class="head" style="border-bottom:1px solid var(--rule)"><span class="label">Note</span><span>${esc(state.notes)}</span></div>
        <div class="acts"><button class="btn primary" id="quote" type="button">Send quote</button><button class="btn" id="ask" type="button">Ask a question</button></div>
        <div class="flash" id="flash" style="padding:0 14px 12px"></div>
      </div>
    </div>`;
  }

  function render() {
    for (let i = 1; i <= 4; i++) $('s' + i).toggleAttribute('aria-current', false);
    $('s' + state.step).setAttribute('aria-current', 'step');
    const st = $('stage');
    if (state.step === 1) st.innerHTML = kitPanel(false) + sideStep1();
    if (state.step === 2) st.innerHTML = kitPanel(false) + sideStep2();
    if (state.step === 3) st.innerHTML = kitPanel(true) + sideStep3();
    if (state.step === 4) st.innerHTML = stage4();
    wire();
  }
  function go(n) { if (n >= 3 && !state.house) n = 2; state.step = n; render(); }
  function wire() {
    const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
    on('go2', 'click', () => go(2));
    on('pick', 'click', () => { state.house = true; render(); });
    on('go3', 'click', () => go(3));
    on('m-collect', 'click', () => { state.mode = 'collect'; render(); });
    on('m-deliver', 'click', () => { state.mode = 'deliver'; render(); });
    on('out', 'change', e => { state.out = e.target.value || state.out; if (state.back < state.out) state.back = state.out; render(); });
    on('back', 'change', e => { state.back = e.target.value < state.out ? state.out : (e.target.value || state.back); render(); });
    on('notes', 'input', e => { state.notes = e.target.value; });
    on('go4', 'click', () => go(4));
    on('quote', 'click', () => { $('flash').textContent = 'Quote sent to Peter: £1,284 + VAT for ' + days() + ' day' + (days() > 1 ? 's' : '') + ' (example figure).'; });
    on('ask', 'click', () => { $('flash').textContent = 'Message thread opened with Peter (concept only).'; });
  }
  for (let i = 1; i <= 4; i++) $('s' + i).addEventListener('click', () => go(i));
  $('house').addEventListener('input', () => { const a = document.activeElement; render(); a && a.id === 'house' && a.focus(); });
  render();
})();
</script>

</body>
</html>
